# The app and its API locally: docker compose up, then open http://localhost:8090 and in Settings
# connect to the address "api/" with the key "dev-key-123".
# (Ports differ from ../www.rezatyrakety.cz, so both can run at once.)
services:
  web:
    build: .
    ports:
      - 8090:80
    volumes:
      - ./:/var/www/html
    environment:
      MLOG_MYSQL_HOST: db
      MLOG_MYSQL_USER: mlog
      MLOG_MYSQL_PASSWORD: mlog
      MLOG_MYSQL_DATABASE: mlog
      MLOG_KEYS: dev-key-123=me
    depends_on:
      - db

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: mlog
      MARIADB_USER: mlog
      MARIADB_PASSWORD: mlog
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    ports:
      - 3307:3306

volumes:
  db:
